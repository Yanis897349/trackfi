"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = 'mise install && mise exec -- pnpm install --frozen-lockfile && if [ "${CONDUCTOR_IS_LOCAL:-0}" = "1" ]; then mise exec -- pnpm db:migrate:local; fi'
run_mode = "concurrent"

[scripts.run.dev]
available_in = [ "local" ]
command = 'WEB_PORT="$CONDUCTOR_PORT" API_PORT="$((CONDUCTOR_PORT + 1))" mise exec -- pnpm dev'
default = true
icon = "play"

[scripts.run.test]
command = "mise exec -- pnpm test"
icon = "test-tube"

[scripts.run.check]
command = "mise exec -- pnpm check"
icon = "circle-check"
