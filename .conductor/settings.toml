"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "mise install && mise exec -- pnpm install --frozen-lockfile"
run_mode = "concurrent"

[scripts.run.dev]
available_in = [ "local" ]
command = 'mise exec -- pnpm db:migrate:local && WEB_PORT="$CONDUCTOR_PORT" API_PORT="$((CONDUCTOR_PORT + 1))" mise exec -- pnpm dev'
default = true
icon = "play"

[scripts.run.test]
command = "mise exec -- pnpm test"
icon = "test-tube"

[scripts.run.check]
command = "mise exec -- pnpm check"
icon = "circle-check"

[scripts.run.disable-waitlist]
available_in = [ "local" ]
command = "mise exec -- pnpm db:migrate:local && mise exec -- pnpm --filter @trackfi/api exec wrangler d1 execute DB --local --command \"UPDATE feature_flags SET enabled = 0, updated_at = CURRENT_TIMESTAMP WHERE key = 'waitlist_mode';\""
icon = "lock-open"

[scripts.run.verify-admin-emails]
available_in = [ "local" ]
command = "mise exec -- pnpm db:migrate:local && mise exec -- pnpm --filter @trackfi/api exec wrangler d1 execute DB --local --command \"UPDATE \\\"user\\\" SET \\\"emailVerified\\\" = 1 WHERE role = 'admin' AND \\\"emailVerified\\\" = 0;\""
icon = "badge-check"
